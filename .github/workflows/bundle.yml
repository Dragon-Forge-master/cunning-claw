name: Bundles

# The download-and-double-click bundles and the installers made from them
# (scripts/bundle.mjs). The bundles are built once on Linux — the app is plain
# JavaScript, only the Node runtime differs — and so are the AppImages, the
# .debs and the Windows installer (makensis runs on Linux). The .dmg needs
# hdiutil, so it is built on a Mac. Then each system's bundle is unpacked and
# started by its own launcher on that system, and each installer is installed
# and started the way an owner would, because "it should work on Windows" is
# not the same as a Windows machine saying so. A tag publishes them to a
# GitHub Release, only after every one of them passes.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - scripts/bundle.mjs
      - .github/workflows/bundle.yml
      - packaging/**
      - src/boot.ts
      - src/first-run.ts
      - src/config.ts
      - src/home-root.ts
      - src/import-old.ts
  # Run by hand to build and test (Actions → Bundles → Run workflow, choose a
  # branch, leave `release` empty); give `release` a version tag (v0.3.0) to
  # publish as well. This exists because a tag cannot always be pushed from
  # where the release is decided, and GitHub can make the tag itself — still
  # only after every smoke test passes.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with this tag, e.g. v0.3.0 (empty = build and test only)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.node.outputs.version }}
    env:
      # The signing hook (docs/INSTALLERS.md). Empty — as on a fork, or until
      # the project buys a certificate — and the step below is skipped.
      WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: node
        # The .dmg is built on another machine; it must bundle this same Node.
        run: echo "version=$(node -p process.versions.node)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: makensis, for the Windows installer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Code-signing certificate (Windows) — skipped without one
        if: env.WINDOWS_SIGN_PFX_BASE64 != ''
        env:
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          sudo apt-get install -y -qq osslsigncode
          umask 077
          printf '%s' "$WINDOWS_SIGN_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/sign.pfx"
          printf '%s' "$WINDOWS_SIGN_PASSWORD" > "$RUNNER_TEMP/sign.pass"
          echo "WINDOWS_SIGN_PFX=$RUNNER_TEMP/sign.pfx" >> "$GITHUB_ENV"
          echo "WINDOWS_SIGN_PASSWORD_FILE=$RUNNER_TEMP/sign.pass" >> "$GITHUB_ENV"
      - name: Build every bundle, the AppImages, the .debs and the Windows installer
        run: npm run bundle -- --all --installer appimage,deb,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux-windows
          path: |
            release/Cunning-Claw-*.AppImage
            release/cunningclaw_*.deb
            release/Cunning-Claw-Setup-*.exe
          if-no-files-found: error

  dmg:
    needs: build
    runs-on: macos-latest
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Developer ID (macOS) — skipped without one
        if: env.MACOS_CERT_P12_BASE64 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"; kp="$(uuidgen)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kp" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Build Cunning Claw.app and its .dmg, for Apple silicon and Intel
        env:
          # Notarisation runs only when these and a Developer ID are all present.
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: npm run bundle -- --target darwin-arm64 --target darwin-x64 --installer dmg --no-archive --node "${{ needs.build.outputs.node }}"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-mac
          path: release/Cunning-Claw-*.dmg
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            launcher: Cunning Claw.sh
          - os: macos-latest
            target: darwin-arm64
            launcher: Cunning Claw.command
          - os: windows-latest
            target: win-x64
            launcher: Cunning Claw.cmd
    runs-on: ${{ matrix.os }}
    env:
      CLAW_NO_BROWSER: "1"
    steps:
      # No checkout and no setup-node: the bundle must stand on its own.
      - uses: actions/download-artifact@v4
        with:
          name: bundles
      - name: Unpack, as a user would
        shell: bash
        run: |
          # One of the two names never exists for a given system; with bash's
          # -e -o pipefail an `ls` of both fails the step before anything unpacks.
          for f in cunningclaw-*-${{ matrix.target }}.tar.gz cunningclaw-*-${{ matrix.target }}.zip; do
            [ -f "$f" ] || continue
            case "$f" in *.tar.gz) tar -xzf "$f" ;; *) unzip -q "$f" ;; esac
          done
          ls -d cunningclaw-*-${{ matrix.target }}/
      - name: Double-click (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd cunningclaw-*-${{ matrix.target }}
          nohup "./${{ matrix.launcher }}" > "$RUNNER_TEMP/boot.log" 2>&1 &
      - name: Double-click (Windows), and it opens on the setup page
        # One step, not two: the first run's log showed the claw lit and
        # waiting on Windows, yet nothing answered the next step's curl —
        # the Windows runner ends what a step started when that step ends.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Directory "cunningclaw-*-${{ matrix.target }}" | Select-Object -First 1
          $claw = Start-Process -FilePath (Join-Path $dir.FullName "${{ matrix.launcher }}") -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\boot.log" -RedirectStandardError "$env:RUNNER_TEMP\boot.err"
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            $home_ = & curl.exe -s -o NUL -w "%{http_code}" --max-time 2 http://127.0.0.1:3900/
            $welcome = & curl.exe -s -o NUL -w "%{http_code}" --max-time 2 http://127.0.0.1:3900/welcome
            if ($home_ -eq "302" -and $welcome -eq "200") { $ok = $true; break }
            Start-Sleep -Seconds 2
          }
          "--- boot log ---"; Get-Content "$env:RUNNER_TEMP\boot.log", "$env:RUNNER_TEMP\boot.err" -ErrorAction SilentlyContinue
          if (-not $ok) { "Bundle smoke failed on ${{ matrix.target }}: / -> $home_, /welcome -> $welcome"; exit 1 }
          "Bundle smoke passed: ${{ matrix.target }} started from its own launcher and opened on setup"
      - name: It opens on the setup page
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ok=""
          for i in $(seq 1 45); do
            home=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:3900/ || true)
            welcome=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:3900/welcome || true)
            if [ "$home" = "302" ] && [ "$welcome" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          echo "--- boot log ---"; cat "$RUNNER_TEMP/boot.log" "$RUNNER_TEMP/boot.err" 2>/dev/null || true
          if [ -z "$ok" ]; then echo "Bundle smoke failed on ${{ matrix.target }}: / -> $home, /welcome -> $welcome"; exit 1; fi
          echo "Bundle smoke passed: ${{ matrix.target }} started from its own launcher and opened on setup"

  # Each installer, installed and started on its own system. Every one ends
  # by checking the point of an installer: the token the claw writes on its
  # first start (.env) is in the owner's own folder, not beside the code.
  smoke-appimage:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLAW_NO_BROWSER: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers-linux-windows
      - name: Mark it executable and start it, unpacked rather than mounted (no FUSE assumed)
        run: |
          img=$(ls Cunning-Claw-*-linux-x86_64.AppImage)
          chmod +x "$img"
          APPIMAGE_EXTRACT_AND_RUN=1 nohup "./$img" > "$RUNNER_TEMP/boot.log" 2>&1 &
      - name: It opens on the setup page, and keeps the owner's things in ~/.local/share
        run: |
          ok=""
          for i in $(seq 1 45); do
            home=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:3900/ || true)
            welcome=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:3900/welcome || true)
            if [ "$home" = "302" ] && [ "$welcome" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          echo "--- boot log ---"; cat "$RUNNER_TEMP/boot.log" || true
          if [ -z "$ok" ]; then echo "AppImage smoke failed: / -> $home, /welcome -> $welcome"; exit 1; fi
          owner="$HOME/.local/share/cunningclaw"
          test -f "$owner/.env" || { echo "No .env in $owner"; exit 1; }
          test -f "$owner/claw.config.json" || { echo "The config was not seeded into $owner"; exit 1; }
          if ls /tmp/appimage_extracted_*/app/.env 2>/dev/null; then echo ".env was written beside the code"; exit 1; fi
          echo "AppImage smoke passed: started, opened on setup, and its .env is in $owner"

  # The .deb, installed with apt as an owner on Ubuntu would, started as the
  # menu entry starts it (CLAW_NO_TERMINAL: run where it stands rather than
  # open a terminal on itself), then removed with apt — keeping the owner's folder.
  smoke-deb:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLAW_NO_BROWSER: "1"
      CLAW_NO_TERMINAL: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers-linux-windows
      - name: Install with apt, as an owner would
        run: |
          deb=$(ls cunningclaw_*_amd64.deb)
          dpkg-deb --info "$deb"
          sudo apt-get install -y "./$deb"
          dpkg -s cunningclaw | grep -E '^(Status|Version|Architecture|Maintainer|Depends):'
          test -f /opt/cunningclaw/app/installed.json || { echo "Not marked installed"; exit 1; }
          test -x /usr/bin/cunningclaw || { echo "No /usr/bin/cunningclaw"; exit 1; }
          test -f /usr/share/applications/cunningclaw.desktop || { echo "No menu entry"; exit 1; }
          test -f /usr/share/icons/hicolor/256x256/apps/cunningclaw.png || { echo "No icon"; exit 1; }
          # The code is root's: the owner cannot write beside it, which is why installed.json moves his things.
          if [ -w /opt/cunningclaw/app ]; then echo "/opt/cunningclaw/app is writable by $(id -un)"; exit 1; fi
      - name: Start it by its command
        run: |
          nohup cunningclaw > "$RUNNER_TEMP/boot.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/claw.pid"
      - name: It opens on the setup page, and keeps the owner's things in ~/.local/share
        run: |
          ok=""
          for i in $(seq 1 45); do
            home=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:3900/ || true)
            welcome=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:3900/welcome || true)
            if [ "$home" = "302" ] && [ "$welcome" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          echo "--- boot log ---"; cat "$RUNNER_TEMP/boot.log" || true
          if [ -z "$ok" ]; then echo ".deb smoke failed: / -> $home, /welcome -> $welcome"; exit 1; fi
          curl -s http://127.0.0.1:3900/cunningclaw.json; echo
          owner="$HOME/.local/share/cunningclaw"
          test -f "$owner/.env" || { echo "No .env in $owner"; exit 1; }
          test -f "$owner/claw.config.json" || { echo "The config was not seeded into $owner"; exit 1; }
          if sudo find /opt/cunningclaw -name .env | grep -q .; then echo ".env was written under /opt"; exit 1; fi
          echo ".deb smoke passed: installed with apt, started, opened on setup, and its .env is in $owner"
      - name: Remove it with apt, and the owner's folder stays
        run: |
          kill "$(cat "$RUNNER_TEMP/claw.pid")" || true
          sudo apt-get remove -y cunningclaw
          if dpkg -s cunningclaw 2>/dev/null | grep -q '^Status: install ok installed'; then echo "Still installed"; exit 1; fi
          for p in /opt/cunningclaw /usr/bin/cunningclaw /usr/share/applications/cunningclaw.desktop; do
            if [ -e "$p" ]; then echo "Left behind: $p"; exit 1; fi
          done
          test -f "$HOME/.local/share/cunningclaw/.env" || { echo "Removing the package deleted the owner's folder"; exit 1; }
          echo ".deb removal passed: the app is gone and $HOME/.local/share/cunningclaw is kept"

  smoke-windows-installer:
    needs: build
    runs-on: windows-latest
    env:
      CLAW_NO_BROWSER: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers-linux-windows
      # One step: the Windows runner ends what a step started when that step ends.
      - name: Install silently, start from the Start menu's target, uninstall — keeping the owner's folder
        shell: pwsh
        run: |
          $setup = Get-ChildItem "Cunning-Claw-Setup-*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { "Installer exited $($p.ExitCode)"; exit 1 }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Cunning Claw"
          $owner = Join-Path $env:LOCALAPPDATA "CunningClaw"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CunningClaw"
          foreach ($f in @("Cunning Claw.cmd", "app\installed.json", "runtime\node.exe", "Uninstall Cunning Claw.exe")) {
            if (-not (Test-Path (Join-Path $dir $f))) { "Not installed: $f"; exit 1 }
          }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath("Programs")) "Cunning Claw.lnk"))) { "No Start menu entry"; exit 1 }
          if (-not (Test-Path $key)) { "Not in Add or remove programs"; exit 1 }
          "Installed: $((Get-ItemProperty $key).DisplayName) $((Get-ItemProperty $key).DisplayVersion)"

          $claw = Start-Process -FilePath (Join-Path $dir "Cunning Claw.cmd") -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\boot.log" -RedirectStandardError "$env:RUNNER_TEMP\boot.err"
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            $home_ = & curl.exe -s -o NUL -w "%{http_code}" --max-time 2 http://127.0.0.1:3900/
            $welcome = & curl.exe -s -o NUL -w "%{http_code}" --max-time 2 http://127.0.0.1:3900/welcome
            if ($home_ -eq "302" -and $welcome -eq "200") { $ok = $true; break }
            Start-Sleep -Seconds 2
          }
          "--- boot log ---"; Get-Content "$env:RUNNER_TEMP\boot.log", "$env:RUNNER_TEMP\boot.err" -ErrorAction SilentlyContinue
          if (-not $ok) { "Installer smoke failed: / -> $home_, /welcome -> $welcome"; exit 1 }
          if (-not (Test-Path (Join-Path $owner ".env"))) { "No .env in $owner"; exit 1 }
          if (Test-Path (Join-Path $dir "app\.env")) { ".env was written beside the code"; exit 1 }
          & taskkill.exe /PID $claw.Id /T /F | Out-Null

          # _?= runs the uninstaller in place, so -Wait waits for the real work.
          $u = Start-Process -FilePath (Join-Path $dir "Uninstall Cunning Claw.exe") -ArgumentList "/S", "_?=$dir" -Wait -PassThru
          if ($u.ExitCode -ne 0) { "Uninstaller exited $($u.ExitCode)"; exit 1 }
          if (Test-Path (Join-Path $dir "app")) { "The app is still installed"; exit 1 }
          if (Test-Path $key) { "Still in Add or remove programs"; exit 1 }
          if (-not (Test-Path (Join-Path $owner ".env"))) { "The uninstaller deleted the owner's folder unasked"; exit 1 }
          "Windows installer smoke passed: installed per-user, started, opened on setup, uninstalled, and the owner's folder kept"

  smoke-dmg:
    needs: dmg
    runs-on: macos-latest
    env:
      CLAW_NO_BROWSER: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers-mac
      - name: Attach the .dmg and drag the app to Applications, as a user would
        run: |
          dmg=$(ls Cunning-Claw-*-mac-arm64.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          test -L "$RUNNER_TEMP/dmg/Applications" || { echo "No Applications link to drag onto"; exit 1; }
          test -f "$RUNNER_TEMP/dmg/READ ME FIRST.txt"
          cp -R "$RUNNER_TEMP/dmg/Cunning Claw.app" /Applications/
          hdiutil detach "$RUNNER_TEMP/dmg"
          plutil -lint "/Applications/Cunning Claw.app/Contents/Info.plist"
      - name: Start it from its own executable
        # CLAW_NO_TERMINAL: run where it stands, instead of opening Terminal on
        # itself as a Finder launch does. That path is untested on hardware
        # (docs/INSTALLERS.md); this checks everything after it.
        run: |
          CLAW_NO_TERMINAL=1 nohup "/Applications/Cunning Claw.app/Contents/MacOS/Cunning Claw" > "$RUNNER_TEMP/boot.log" 2>&1 &
      - name: It opens on the setup page, and keeps the owner's things in Application Support
        run: |
          ok=""
          for i in $(seq 1 45); do
            home=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:3900/ || true)
            welcome=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:3900/welcome || true)
            if [ "$home" = "302" ] && [ "$welcome" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          echo "--- boot log ---"; cat "$RUNNER_TEMP/boot.log" || true
          if [ -z "$ok" ]; then echo ".dmg smoke failed: / -> $home, /welcome -> $welcome"; exit 1; fi
          owner="$HOME/Library/Application Support/cunningclaw"
          test -f "$owner/.env" || { echo "No .env in $owner"; exit 1; }
          test -f "$owner/claw.config.json" || { echo "The config was not seeded into $owner"; exit 1; }
          if [ -e "/Applications/Cunning Claw.app/Contents/Resources/app/.env" ]; then echo ".env was written inside the app"; exit 1; fi
          echo ".dmg smoke passed: dragged to Applications, started, opened on setup, and its .env is in $owner"

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [smoke, smoke-appimage, smoke-deb, smoke-windows-installer, smoke-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
      # Only the release notes: docs/releases/<tag>.md, when there is one.
      - uses: actions/checkout@v4
        with:
          path: src-notes
          sparse-checkout: docs/releases
      - name: Publish to the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, never ${{ }} inside the script: an input is text someone typed.
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Not a version tag: $TAG"; exit 1 ;; esac
          # The tag must name the version that was built, or the downloads and the release disagree.
          built="v$(ls cunningclaw-*-linux-x64.tar.gz | sed -E 's/^cunningclaw-(.*)-linux-x64\.tar\.gz$/\1/')"
          if [ "$built" != "$TAG" ]; then echo "Tag $TAG does not match the built version $built (package.json)"; exit 1; fi
          # --target makes the tag at the tested commit when it does not exist yet.
          notes="src-notes/docs/releases/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else
            set -- --notes "Install the one for your computer: the Setup .exe on Windows, the .dmg on a Mac, the .AppImage on Linux. Or take the .zip / .tar.gz, unzip it and read READ ME FIRST.txt. Not code-signed yet: Windows and macOS will ask once before the first run."
          fi
          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "Cunning Claw $TAG" \
            "$@" cunningclaw-*.zip cunningclaw-*.tar.gz Cunning-Claw-*.exe Cunning-Claw-*.dmg Cunning-Claw-*.AppImage cunningclaw_*.deb
