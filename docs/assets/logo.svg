<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cunning Claw">
  <defs>
    <linearGradient id="claw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff0ff"/>
      <stop offset="0.55" stop-color="#35d6ed"/>
      <stop offset="1" stop-color="#1a8ba0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#dffaff"/>
      <stop offset="0.5" stop-color="#35d6ed"/>
      <stop offset="1" stop-color="#35d6ed" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- outer ring: the "system" the cunning man works within -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#1a6c7a" stroke-width="3" stroke-dasharray="4 12" opacity="0.55"/>

  <!-- three talons closing into a C — a claw that is also the initial -->
  <g fill="url(#claw)" filter="url(#glow)">
    <!-- upper talon -->
    <path d="M369 132
             C300 96 214 104 168 160
             C205 132 268 128 316 152
             C300 150 286 154 276 164
             C312 156 348 168 372 196
             C374 174 374 150 369 132 Z"/>
    <!-- middle talon (longest, the point of the C's opening) -->
    <path d="M150 256
             C150 197 190 165 250 156
             C210 178 190 214 190 256
             C190 298 210 334 250 356
             C190 347 150 315 150 256 Z"/>
    <!-- lower talon -->
    <path d="M369 380
             C300 416 214 408 168 352
             C205 380 268 384 316 360
             C300 362 286 358 276 348
             C312 356 348 344 372 316
             C374 338 374 362 369 380 Z"/>
  </g>

  <!-- the struck spark at the claw's grasp -->
  <circle cx="326" cy="256" r="34" fill="url(#core)"/>
  <circle cx="326" cy="256" r="11" fill="#eafcff" filter="url(#glow)"/>
</svg>
