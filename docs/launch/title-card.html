<style>
/* docs/BRAND.md tokens, verbatim. Dark-first by ruling: one theme, painted explicitly. */
:root{
  --ink:#0a111c; --ink2:#0e1826; --cyan:#35d6ed; --ice:#7ff0ff; --deep:#1a8ba0;
  --text:#dfe9f2; --dim:#8496a8;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--text)}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.card{position:relative;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse 58% 52% at 50% 42%,#0f2236 0%,var(--ink) 72%)}
/* The Forge Claw: one colour (cyan on ink), one orientation, never rotated. Glow is
   allowed here because the mark is far above the 64px floor (BRAND.md rule 6). */
.mark{color:var(--cyan);line-height:0;filter:drop-shadow(0 0 34px rgba(53,214,237,.30))}
.mark svg{display:block;width:100%;height:auto}
/* The wordmark is always monospace, letterspaced, cyan on ink. text-indent balances the trailing tracking. */
.wordmark{font-family:var(--mono);font-weight:600;color:var(--cyan);letter-spacing:.2em;text-indent:.2em;line-height:1;white-space:nowrap;
  text-shadow:0 0 28px rgba(53,214,237,.28)}
/* The strapline beneath: dim, wider-spaced, never larger than a third of the wordmark height. */
.strap{font-family:var(--mono);font-weight:400;color:var(--dim);letter-spacing:.42em;text-indent:.42em;line-height:1;white-space:nowrap}

.mark{width:400px;padding:100px 100px 0;box-sizing:content-box;margin-bottom:-28px}
.wordmark{font-size:112px}
.strap{font-size:30px;margin-top:38px}
</style>
